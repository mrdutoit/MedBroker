    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- §151 follow-up (13 Aug 2026) — Mark asked how to get the
         MedBroker mark showing in the browser tab. The asset already
         existed (src/assets/favicon.svg) but was never linked here at
         all. Copied to public/ (Vite serves that folder as-is at the
         site root, unprocessed) rather than importing it as a JS
         module, since a plain <link> tag in a static HTML head needs a
         direct URL, not a bundled asset reference. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MedBroker</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
